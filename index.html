<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Siddhānta-Yantra · सिद्धांत-यंत्र — Sūrya-Siddhānta Cosmology Engine</title>
    <meta
      name="description"
      content="An interactive 3D model of classical Indian astronomy: Sūrya-Siddhānta manda–śīghra epicycles, the seven Vāyu strata bound to Dhruva, Āryabhaṭa's rotating Earth, Prākṛtika pralaya and the Advaita view of reality."
    />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff3c4'/%3E%3Cstop offset='.5' stop-color='%23ffb347'/%3E%3Cstop offset='1' stop-color='%23ff6a2a' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2305060f' stroke='%23ffd27a' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app" aria-label="Siddhānta-Yantra cosmological simulation">
      <!-- WebGL render target (Three.js) -->
      <div id="webgl-canvas" role="img" aria-label="3D armillary model of the Sūrya-Siddhānta cosmos"></div>
      <!-- CSS2D Devanagari labels -->
      <div id="label-layer" aria-hidden="true"></div>
      <!-- Glassmorphic HUD (OverlayUI) -->
      <div id="hud-overlay"></div>
      <!-- Verse drawer (ShlokaInspector) -->
      <div id="shloka-modal"></div>
    </main>

    <div id="boot" aria-live="polite">
      <div class="boot-mandala" aria-hidden="true"></div>
      <div class="boot-sa">सिद्धांत-यंत्र</div>
      <div class="boot-en">Assembling the bhacakra…</div>
    </div>

    <noscript>Siddhānta-Yantra requires JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
